name: Linux release validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/linux-release-validation.yml"
      - ".github/workflows/release-artifacts.yml"
      - "apps/desktop/electron-builder.json"
      - "apps/desktop/package.json"
      - "apps/desktop/scripts/packaged-smoke.mjs"
      - "apps/desktop/src/**"
      - "packages/**"
      - "packaging/arch/**"
      - "scripts/release/linux-beta.mjs"
      - "scripts/release/audit-linux-package.mjs"
      - "scripts/release/multiplatform-manifest.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-release:
    name: Linux x64 release path
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libfuse2 xvfb build-essential python3

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show canonical Linux guide formatting
        shell: bash
        run: |
          cp docs/install/linux.md /tmp/linux-guide.md
          pnpm exec prettier --write docs/install/linux.md
          git diff -- docs/install/linux.md
          mv /tmp/linux-guide.md docs/install/linux.md

      - name: Build and validate Linux release
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm release:linux:beta
