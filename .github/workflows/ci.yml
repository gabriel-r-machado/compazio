name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify DCO for external contributions
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true && github.actor != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          mapfile -t commits < <(git rev-list --no-merges "$merge_base..$HEAD_SHA")

          failed=0
          for commit in "${commits[@]}"; do
            if git show -s --format='%B' "$commit" | grep -Eiq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "✓ $commit"
            else
              echo "::error::Commit $commit is missing a Signed-off-by trailer. Use git commit -s and update the pull request."
              failed=1
            fi
          done
          exit "$failed"

      - name: ESLint
        run: pnpm exec eslint . --max-warnings 0

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: >-
          pnpm exec vitest run
          --exclude "packages/cli/src/cli.test.ts"
          --exclude "packages/compazio-v2-runtime/src/agents.test.ts"
