name: Apply ConPTY smoke fix

on:
  push:
    branches:
      - fix/conpty-smoke-variance
    paths:
      - .github/workflows/apply-conpty-smoke-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/conpty-smoke-variance

      - name: Patch smoke harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src/v2/main/e2e/v2-smoke.ts")
          text = path.read_text(encoding="utf-8")
          old = '''        screen.dispatchEvent(
            new WheelEvent("wheel", { bubbles: true, cancelable: true, deltaY: 0 })
          );
          if (screen.dataset.terminalMouseTracking !== "none")
            throw new Error("ConPTY fixture unexpectedly forwarded its private mouse mode");
          '''
          new = '''        screen.dispatchEvent(
            new WheelEvent("wheel", { bubbles: true, cancelable: true, deltaY: 0 })
          );
          // ConPTY behavior differs across supported Windows images: some versions consume the
          // TUI's DEC private mouse-mode announcement, while others forward it to xterm. Both are
          // valid. The SGR frame and coordinate assertions below verify the actual end-to-end
          // mouse contract regardless of which path is active.
          '''
          if old not in text:
              raise SystemExit("expected ConPTY smoke assertion was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src/v2/main/e2e/v2-smoke.ts
          git commit -m "test: accept valid ConPTY mouse tracking variants"
          git push origin HEAD:fix/conpty-smoke-variance
