name: Dependency review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    # GitHub dependency review is available for public repositories (and
    # private repositories with the appropriate security features enabled).
    if: ${{ github.event.repository.private == false }}
    name: Review dependency changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
