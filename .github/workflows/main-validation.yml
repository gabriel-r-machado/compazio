name: Main validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Run RLS and database tests
        run: pnpm exec supabase test db --local supabase/tests/database

      - name: Check database security advisors
        run: pnpm exec supabase db advisors --local --type security --fail-on error

  windows-desktop:
    name: Windows desktop
    # Pin the smoke suite to a stable Windows image. windows-latest currently resolves to
    # Server 2025, whose ConPTY forwards DEC mouse-mode sequences differently and trips a
    # harness-only assertion even though the application path itself remains valid.
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full unit test suite
        run: pnpm exec vitest run --testTimeout=15000

      - name: Integration tests
        run: pnpm exec vitest run --config vitest.integration.config.ts --testTimeout=60000

      - name: Run local migration
        run: pnpm db:migrate

      - name: Rebuild Electron native modules
        run: pnpm --filter @forgedeck/desktop native:electron

      - name: Build monorepo
        run: pnpm build

      - name: Desktop E2E smoke
        run: pnpm test:e2e

      - name: Build community desktop
        run: pnpm --filter @forgedeck/desktop build:v2

      - name: Community desktop smoke
        run: pnpm test:v2-electron-smoke
